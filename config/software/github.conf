# =============================================================================
# Herramientas descargables desde releases oficiales (GitHub / web oficial)
# Formato:  herramienta|patrón_del_asset|url|binario_destino(opcional)
#   - patrón_del_asset: expresión regular sobre el nombre del archivo.
#   - url: API del release "latest" de GitHub, o URL directa de descarga.
#   - binario_destino: nombre final del binario si es archivo suelto (opcional).
# Se elige el asset según el gestor (rpm para dnf/zypper, deb para apt,
# pkg.tar.* para pacman, y binario/tar.gz como alternativa universal).
# =============================================================================

