# =============================================================================
# Descripciones de aplicaciones para el selector con cursor de Talarium.
# Formato:  etiqueta|Nombre visible|Descripción breve (lo más importante)
#   - La etiqueta coincide con el paquete (o flatpak:ID, o herramienta GitHub)
#     de config/software/*.conf y github.conf.
#   - Solo se muestran los 2 primeros renglones de la descripción.
# Edita o añade entradas libremente.
# =============================================================================

# ============================================================ S-TIER (esencial)
timeshift|Timeshift|Copias de seguridad del sistema (snapshots). Si rompes algo, restaura tu Linux a un estado anterior en dos clics.
flatpak|Flatpak|Sistema de paquetes universal y aislado. Instala apps actualizadas sin tocar las dependencias del sistema (acompañado de Flathub).
steam|Steam|La mayor plataforma de juegos para PC. Con Proton convierte a Linux en un sistema de primera para jugar (hasta el 80% de tu biblioteca funciona).
fastfetch|Fastfetch|Muestra la información de tu equipo (CPU, RAM, GPU, escritorio) en una bonita captura de terminal. Es el clásico comando de "presumir setup".
akmod-nvidia|NVIDIA (akmod)|Controladores propietarios de NVIDIA para Fedora. Necesarios para jugar o usar CUDA sin tirones.
nvidia|NVIDIA|Controladores propietarios de NVIDIA para Arch. Necesarios para jugar o usar CUDA sin tirones.
nvidia-driver-535|NVIDIA|Controladores propietarios de NVIDIA para Debian/Ubuntu. Comprueba la versión recomendada para tu distro.
nvidia-driver-G06|NVIDIA|Controladores propietarios de NVIDIA para openSUSE.

# ============================================================ A-TIER (día a día)
flatpak:io.github.zen_browser.zen|Zen Browser|Navegador moderno basado en Firefox: interfaz minimalista, pestañas verticales y alto rendimiento.
firefox|Firefox|El navegador de referencia en Linux. Privacidad, extensiones y rendimiento de sobra.
chromium|Chromium|Navegador de código abierto, base del Chrome de Google.
kdeconnect|KDE Connect|Conecta tu teléfono Android con la PC: notificaciones, archivos, llamadas y portapapeles sincronizados.
flatpak:com.usebottles.bottles|Bottles|La forma más fácil de gestionar entornos de Wine para ejecutar programas .exe de Windows.
code|Visual Studio Code|El editor de código por excelencia de Microsoft. Se descarga desde la web oficial.
flatpak:com.vscodium.codium|VSCodium|VS Code 100% libre y sin telemetría. Misma experiencia, sin rastreo de Microsoft.
flatpak:org.onlyoffice.desktopeditors|OnlyOffice|Suite de oficina con máxima compatibilidad con archivos .docx/.xlsx. Supera a LibreOffice en formato e interfaz.
flatpak:com.bitwarden.desktop|Bitwarden|Gestor de contraseñas de código abierto, multiplataforma y muy seguro.

# ============================================================ B-TIER (muy buenos)
obs-studio|OBS Studio|El estándar de la industria para grabar pantalla o transmitir en vivo. En Linux corre de maravilla.
flatpak:com.heroicgameslauncher.hgl|Heroic Games Launcher|Lanzador para tus juegos de Epic Games, GOG y Amazon Prime Gaming.
lutris|Lutris|Complemento ideal de Steam para gestionar juegos de otras plataformas y lanzadores.
krita|Krita|El rey de la ilustración digital y la pintura. Imbatible para dibujar.
gimp|GIMP|El estándar libre del retoque fotográfico. Rápido y completo.
gnome-extension-manager|Extension Manager|Busca e instala extensiones de GNOME para personalizar la barra de tareas y funciones en un segundo.
gnome-shell-extension-manager|Extension Manager|Busca e instala extensiones de GNOME para personalizar el escritorio.
stacer|Stacer|Suite visual para monitorizar CPU/RAM, limpiar archivos basura y gestionar apps que inician con el sistema.

# ============================================================ C-TIER (de nicho)
gparted|GParted|El rey del formateo y la gestión de particiones de discos. Vital al reinstalar o agregar almacenamiento.
audacity|Audacity|Edita, corta y limpia audio de forma rápida.
blender|Blender|Suite de modelado y animación 3D de nivel profesional (a la par de software de miles de dólares).
transmission|Transmission|Cliente de torrents extremadamente ligero, simple y sin publicidad.
transmission-gtk|Transmission|Cliente de torrents extremadamente ligero, simple y sin publicidad.

